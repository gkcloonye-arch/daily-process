 SEL=Object.assign({},pool().find(s=>e.nw?(s.nw&&nz(s.n)===nz(e.n)):s.c==e.c)||{c:e.c,n:e.n,p:e.ph||'',b:0,nw:!!e.nw});
 $('#q').value=e.n;$('#am').value=e.a;$('#nt').value=e.m||'';$('#cx').hidden=false;setK();si();chk();$('#fm').scrollIntoView({behavior:'smooth',block:'start'})}
function del(id){const e=ST.e.find(x=>x.id===id);if(!e||ST.fin)return;if(!confirm('حذف '+(e.k==='i'?'فاتورة':'دفعة')+' «'+e.n+'» بمبلغ '+M(e.a)+'؟'))return;ST.e=ST.e.filter(x=>x.id!==id);if(ED===id)clr();sv();draw();toast('🗑 تم الحذف')}
/* ---- العرض ---- */
function stats(){const I=ST.e.filter(e=>e.k==='i'),P=ST.e.filter(e=>e.k==='p'),ti=sum(I,e=>e.a),tp=sum(P,e=>e.a);
 $('#st').innerHTML='<div class="c"><div class="dr"><label>📅 تاريخ اليومية<input type="date" id="jd" value="'+ST.date+'"'+(ST.e.length||ST.fin?' disabled':'')+'></label><div class="sn">أرصدة الموردين حتى<br><b>'+dtp(D.t)+'</b></div></div>'
 +(ST.date!==tdy()?'<div class="wn">⚠ تاريخ اليومية ('+fdd(ST.date)+') يختلف عن تاريخ اليوم</div>':'')
 +(!OKS?'<div class="wn">⚠ الحفظ التلقائي غير متاح في هذا المتصفح — لا تُغلق الصفحة قبل «إنهاء اليومية»</div>':'')
 +'<div class="g3"><div class="k iv"><b>'+M(ti)+'</b><span>🧾 فواتير ('+I.length+')</span></div><div class="k pv"><b>'+M(tp)+'</b><span>💸 دفعات ('+P.length+')</span></div><div class="k"><b>'+M(ti-tp)+'</b><span>الصافي</span></div></div></div>';
 const j=$('#jd');if(j)j.onchange=()=>{ST.date=j.value||tdy();sv();draw()}}
function list(){const A=[...ST.e].sort((a,b)=>a.t<b.t?1:a.t>b.t?-1:0),ro=!!ST.fin;
 const tb=[['all','الكل ('+A.length+')'],['i','🧾 فواتير'],['p','💸 دفعات'],['s','👥 الموردون']].map(x=>'<button type="button" data-t="'+x[0]+'" class="'+(TAB===x[0]?'on':'')+'">'+x[1]+'</button>').join('');
 let body='';
 if(!A.length)body='<p class="mu cen">لا توجد قيود بعد. أضف أول فاتورة أو دفعة من النموذج.</p>';
 else if(TAB==='s'){const G={};A.forEach(e=>{const k=ekey(e),g=G[k]||(G[k]={n:e.n,nw:e.nw,i:0,p:0,c:0});g[e.k]+=e.a;g.c++});
  body=Object.values(G).sort((a,b)=>(b.i+b.p)-(a.i+a.p)).map(g=>'<div class="e"><div class="g1"><b>'+E(g.n)+'</b>'+(g.nw?' <span class="tg">جديد</span>':'')+'<div class="mu">'+g.c+' قيد · فواتير '+M(g.i)+' · دفعات '+M(g.p)+'</div></div><b class="am '+(g.i-g.p>=0?'i':'p')+'">'+M(g.i-g.p)+'</b></div>').join('')}
 else body=A.filter(e=>TAB==='all'||e.k===TAB).map(e=>'<div class="e"><span class="ei">'+(e.k==='i'?'🧾':'💸')+'</span><div class="g1"><b>'+E(e.n)+'</b>'+(e.nw?' <span class="tg">جديد</span>':'')+'<div class="mu">'+ftm(e.t)+(e.m?' · '+E(e.m):'')+(e.nf?' · 📲 أُرسل':'')+'</div></div><b class="am '+e.k+'">'+M(e.a)+'</b><div class="ea"><button type="button" data-nf="'+e.id+'" aria-label="إرسال إشعار للمورد">'+(e.nf?'✅':'📲')+'</button>'+(ro?'':'<button type="button" data-ed="'+e.id+'" aria-label="تعديل">✏️</button><button type="button" data-dl="'+e.id+'" aria-label="حذف">🗑</button>')+'</div></div>').join('');
 $('#ls').innerHTML='<div class="tabs">'+tb+'</div>'+body}
function bar(){const f=$('#fb'),I=ST.e.filter(e=>e.k==='i'),P=ST.e.filter(e=>e.k==='p');f.hidden=!!ST.fin;
 f.innerHTML='<div class="tt"><b>'+ST.e.length+' قيد</b><div class="ts"><small>🧾 '+M(sum(I,e=>e.a))+'</small><small>💸 '+M(sum(P,e=>e.a))+'</small></div></div><button type="button" class="bt big" id="fin"'+(ST.e.length?'':' disabled')+'>✅ إنهاء اليومية</button>'}
const fname=()=>'yomia-'+ST.date+'.json';
function dnc(){const d=$('#dn');if(!ST.fin){d.innerHTML='';return}
 d.innerHTML='<div class="c ok"><h3>✅ تم إنهاء اليومية</h3><p class="mu" style="font-size:.88rem">يومية '+fdd(ST.date)+' — '+ST.e.length+' قيد. تم تنزيل الملف <b dir="ltr">'+fname()+'</b>. أرسله إلى مسؤول الموقع الرئيسي لاستدعائه تلقائيًا.</p><div class="ac"><button type="button" class="bt" id="dl">⬇️ تنزيل الملف</button>'+(navigator.share?'<button type="button" class="bt wa" id="shr">📤 مشاركة</button>':'')+'</div><div class="ac"><button type="button" class="bt gh" id="ro">✏️ إعادة فتح اليومية</button><button type="button" class="bt gh" id="nw">🆕 يومية جديدة</button></div></div>'}
function draw(){stats();dnc();list();bar();$('#fm').hidden=!!ST.fin;$('#mn').classList.toggle('fin',!!ST.fin)}
/* ---- إنهاء اليومية والتنزيل ---- */
function pack(){const e=[...ST.e].sort((a,b)=>a.t<b.t?-1:a.t>b.t?1:0).map(x=>({id:x.id,k:x.k,c:x.c,n:x.n,nw:!!x.nw,ph:x.ph||'',a:x.a,t:x.t,m:x.m||''})),I=e.filter(x=>x.k==='i'),P=e.filter(x=>x.k==='p');
 return{type:'sup-daily',v:1,jid:ST.jid,date:ST.date,site:D.id,finished:ST.fin||Date.now(),entries:e,totals:{ni:I.length,np:P.length,ti:+sum(I,x=>x.a).toFixed(2),tp:+sum(P,x=>x.a).toFixed(2)}}}
const blob=()=>new Blob([JSON.stringify(pack())],{type:'application/json'});
function dl(){const u=URL.createObjectURL(blob()),a=document.createElement('a');a.href=u;a.download=fname();document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
async function shr(){try{const f=new File([blob()],fname(),{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'يومية الموردين '+fdd(ST.date)});return}}catch(e){if(e&&e.name==='AbortError')return}dl();toast('تعذّرت المشاركة المباشرة — تم تنزيل الملف، أرسله يدويًا')}
function overs(){const u={};let n=0;[...ST.e].sort((a,b)=>a.t<b.t?-1:1).forEach(e=>{const k=ekey(e);if(!(k in u))u[k]=e.nw?0:(byC(e.c)||{b:0}).b;if(e.k==='i')u[k]+=e.a;else{if(e.a>u[k]+.005)n++;u[k]-=e.a}});return n}
const mopen=h=>{$('#sh').innerHTML=h;$('#md').classList.add('on')},mclose=()=>$('#md').classList.remove('on');
function fin(){if(!ST.e.length)return;const I=ST.e.filter(e=>e.k==='i'),P=ST.e.filter(e=>e.k==='p'),nw=[...new Set(ST.e.filter(e=>e.nw).map(e=>e.n))],ov=overs();
 mopen('<h3>✅ إنهاء يومية '+fdd(ST.date)+'</h3><div class="g3"><div class="k iv"><b>'+M(sum(I,e=>e.a))+'</b><span>🧾 فواتير ('+I.length+')</span></div><div class="k pv"><b>'+M(sum(P,e=>e.a))+'</b><span>💸 دفعات ('+P.length+')</span></div><div class="k"><b>'+ST.e.length+'</b><span>إجمالي القيود</span></div></div>'
 +(nw.length||ov?'<ul>'+(nw.length?'<li>موردون جدد سيُنشأون: <b>'+nw.map(E).join('، ')+'</b></li>':'')+(ov?'<li>دفعات أكبر من الرصيد: <b>'+ov+'</b> (ستُسجَّل كدفعات مُستثناة)</li>':'')+'</ul>':'')
 +'<p class="mu">سيتم تنزيل ملف اليومية باسم <b dir="ltr">'+fname()+'</b>. يمكنك إعادة فتح اليومية لاحقًا إن لزم.</p><div class="ac"><button type="button" class="bt gh" id="mc">رجوع</button><button type="button" class="bt" id="mo">✅ إنهاء وتنزيل</button></div>')}
/* ---- الأحداث ---- */
document.addEventListener('click',e=>{const t=e.target;if(!t.closest('.sw'))hide();
 const g=t.closest('.sgi');if(g&&g.closest('#sgl')){if(g.dataset.nw)pick({c:null,n:$('#q').value.trim(),p:'',b:0,nw:true});else if(g.dataset.i!=null&&SG[+g.dataset.i])pick(SG[+g.dataset.i]);return}
 if(t.id==='md'){mclose();return}
 const b=t.closest('button');if(!b)return;
 if(b.closest('#sgk')){K=b.dataset.k;setK();chk();return}
 if(b.dataset.t){TAB=b.dataset.t;list();return}
 if(b.dataset.nf){resend(b.dataset.nf);return}if(b.dataset.ed){ed(b.dataset.ed);return}if(b.dataset.dl){del(b.dataset.dl);return}
 switch(b.id){case'rsend':rsend();break;case'add':add();break;case'cx':clr();break;case'fin':fin();break;case'mc':mclose();break;
  case'mo':ST.fin=Date.now();sv();mclose();draw();dl();window.scrollTo(0,0);toast('✅ تم إنهاء اليومية وتنزيل الملف');break;
  case'dl':dl();break;case'shr':shr();break;case'ro':ST.fin=null;sv();draw();break;
  case'nw':if(confirm('بدء يومية جديدة؟ تأكد أنك نزّلت أو شاركت ملف اليومية الحالية.')){const ph0=ST.ph;ST=nj();ST.ph=ph0||{};sv();clr();draw();window.scrollTo(0,0)}break}});
$('#q').oninput=()=>{if(SEL&&$('#q').value!==SEL.n){SEL=null;si();chk()}sug()};
$('#q').onfocus=()=>{if($('#q').value&&!SEL)sug()};
$('#q').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();if(!SEL&&SG[0]&&!$('#sgl').hidden)pick(SG[0])}};
$('#am').oninput=chk;$('#am').onkeydown=$('#nt').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();add()}};
$('#si').oninput=e=>{if(e.target.id==='nph'&&SEL)SEL.p=e.target.value.trim()};
addEventListener('beforeunload',e=>{if(!OKS&&ST.e.length&&!ST.fin){e.preventDefault();e.returnValue=''}});
/* ---- الوضع الليلي / النهاري ---- */
const sysD=()=>matchMedia('(prefers-color-scheme:dark)').matches,curT=()=>document.documentElement.dataset.theme||(sysD()?'dark':'light');
function thb(){const b=$('#th'),d=curT()==='dark';b.textContent=d?'☀️ نهاري':'🌙 ليلي';b.setAttribute('aria-label',d?'التبديل إلى الوضع النهاري':'التبديل إلى الوضع الليلي')}
$('#th').onclick=()=>{const n=curT()==='dark'?'light':'dark';document.documentElement.dataset.theme=n;try{localStorage.setItem('sxth',n)}catch(e){}thb()};
try{matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>{if(!document.documentElement.dataset.theme)thb()})}catch(e){}
$('#nton').checked=NON;$('#nton').onchange=function(){NON=this.checked;try{localStorage.setItem(KEY+'n',NON?'1':'0')}catch(e){}si()};
setK();si();chk();draw();thb();
</script></body></html>
